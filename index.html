<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Астатка - Max Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg-deep:#1e3a8a;
        --glass-bg: rgba(30, 58, 138, 0.55);
        --glass-bg-strong: rgba(29, 78, 216, 0.75);
        --glass-border: rgba(255,255,255,0.25);
        --glass-border-soft: rgba(255,255,255,0.15);
        --accent:#ffffff;
        --accent-2:#93c5fd;
        --accent-glow: rgba(255,255,255,0.25);
        --success:#34d399;
        --success-glow: rgba(52,211,153,0.30);
        --danger:#ff6b6b;
        --text-primary:#ffffff;
        --text-muted:#dbeafe;
        --text-faint:#93c5fd;
        --r-lg:24px;
        --r-md:16px;
        --r-sm:11px;
        --font-ui:'Manrope', system-ui, sans-serif;
        --font-num:'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; }
    html,body{ height:100%; }
    body {
        font-family: var(--font-ui);
        margin: 0; padding: 0;
        color: var(--text-primary);
        background: var(--bg-deep);
        display: flex; justify-content: center;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
    }
    body::before, body::after, .blob-3 {
        content:''; position: fixed; border-radius: 50%;
        filter: blur(80px); z-index: 0; pointer-events: none;
    }
    body::before{
        width: 420px; height: 420px; top: -120px; left: -140px;
        background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 70%);
        animation: float1 22s ease-in-out infinite;
    }
    body::after{
        width: 380px; height: 380px; bottom: -100px; right: -120px;
        background: radial-gradient(circle, rgba(30,64,175,0.6), transparent 70%);
        animation: float2 26s ease-in-out infinite;
    }
    .blob-3{
        width: 320px; height: 320px; top: 40%; left: 60%;
        background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
        animation: float3 30s ease-in-out infinite;
    }
    @keyframes float1{ 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(40px,60px);} }
    @keyframes float2{ 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(-50px,-40px);} }
    @keyframes float3{ 0%,100%{ transform: translate(-50%,-50%) scale(1);} 50%{ transform: translate(-50%,-50%) scale(1.15);} }

    .app-container {
        width: 100%; max-width: 680px;
        min-height: 100vh;
        background: var(--glass-bg);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        border-left: 1px solid var(--glass-border-soft);
        border-right: 1px solid var(--glass-border-soft);
        display: flex; flex-direction: column;
        position: relative; z-index: 1;
        padding-bottom: 85px;
    }
    
    #lock-screen {
        position: fixed; inset: 0; z-index: 100;
        background: var(--bg-deep);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px;
    }
    .lock-logo {
        width: 100px; height: 100px; border-radius: 24px;
        object-fit: cover; margin-bottom: 16px;
        border: 2px solid var(--glass-border);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .lock-title { font-size: 18px; font-weight: 800; margin-bottom: 24px; color: var(--text-primary); text-align: center; }
    .pin-dots {
        display: flex; gap: 14px; margin-bottom: 30px;
    }
    .pin-dot {
        width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid var(--text-primary); background: transparent;
        transition: background .2s, transform .2s;
    }
    .pin-dot.filled { background: var(--text-primary); transform: scale(1.1); }
    .pin-pad {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px;
    }
    .pin-btn {
        background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
        padding: 18px; font-family: var(--font-num); font-size: 20px; font-weight: 700;
        border-radius: var(--r-md); cursor: pointer; color: var(--text-primary);
        text-align: center; transition: background .12s, transform .1s;
    }
    .pin-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
    .lock-error { color: var(--danger); font-size: 13px; font-weight: 700; height: 20px; margin-top: 12px; text-align: center; }

    .header {
        background: rgba(29, 78, 216, 0.5);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--glass-border-soft);
        color: var(--text-primary);
        padding: 16px 18px; display: flex;
        align-items: center; justify-content: space-between;
        font-size: 15px; font-weight: 600;
        position: sticky; top: 0; z-index: 20;
        gap: 10px;
    }
    .header-logo-title {
        display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
    }
    .header-logo { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
    .header .title{ color: var(--text-muted); font-size:13px; font-weight:600; letter-spacing:.2px; }
    .icon-btn {
        width: 38px; height: 38px; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        background: rgba(255,255,255,0.12); border: 1px solid var(--glass-border-soft);
        border-radius: 50%; cursor: pointer; font-size: 17px;
        color: var(--text-primary); transition: background .15s, border-color .15s;
    }
    .icon-btn:active{ background: rgba(255,255,255,0.25); }
    .icon-btn:focus-visible, button:focus-visible, .calc-field:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .taskbar {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        width: calc(100% - 24px); max-width: 640px;
        background: rgba(20, 45, 110, 0.75);
        backdrop-filter: blur(30px) saturate(200%);
        -webkit-backdrop-filter: blur(30px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 28px;
        display: flex; align-items: center; justify-content: space-around;
        padding: 8px 12px; z-index: 45;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .taskbar-btn {
        background: transparent; border: none; outline: none;
        color: var(--text-primary); font-family: var(--font-ui);
        font-size: 11.5px; font-weight: 700; display: flex; flex-direction: column;
        align-items: center; gap: 2px; cursor: pointer; padding: 6px 14px;
        border-radius: 20px; transition: background .2s, transform .15s;
    }
    .taskbar-btn span { font-size: 20px; }
    .taskbar-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.92); }

    .content {
        padding: 18px; flex-grow: 1;
        overflow-y: auto; position: relative;
    }

    .category-btn {
        display: flex; align-items:center; justify-content: center; width: 100%;
        background: var(--glass-bg-strong); color: var(--text-primary);
        border: 1px solid var(--glass-border); padding: 20px 18px; margin-bottom: 12px;
        font-family: var(--font-ui); font-size: 16px; font-weight: 700; border-radius: var(--r-lg);
        cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        transition: transform .12s, border-color .15s, background .15s;
        text-align:center;
    }
    .category-btn:active { transform: scale(0.98); border-color: var(--accent); background: rgba(255,255,255,0.25); }

    #categories-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    #categories-list .category-btn {
        margin-bottom: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 18px 12px;
        background: rgba(37, 99, 235, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #products-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .product-card {
        background: var(--glass-bg-strong); padding: 12px; margin-bottom: 0;
        border: 1px solid var(--glass-border); border-radius: var(--r-md); 
        display: flex; flex-direction: column;
        justify-content: space-between; align-items: stretch; gap: 8px;
        cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        transition: border-color .15s, transform .12s;
        min-height: 110px;
    }
    .product-card:active{ transform: scale(0.985); border-color: var(--accent); }
    .product-title { font-size: 12.5px; font-weight: 700; color: var(--text-primary); text-align: center; }

    .product-val {
        text-align: center; background: rgba(52,211,153,0.2);
        padding: 6px 8px; border-radius: var(--r-sm);
        border: 1px solid rgba(52,211,153,0.5); width: 100%;
    }
    .total-text { font-family: var(--font-num); font-size: 12px; color: var(--success); font-weight: 700; display: block; margin-bottom: 2px; letter-spacing: .2px; }
    .details-text { font-family: var(--font-num); font-size: 9.5px; color: var(--text-faint); display: block; }
    .category-title { color: var(--text-primary); margin-top: 0; margin-bottom: 16px; text-align: center; font-size: 18px; font-weight: 800; }

    .calc-wrapper {
        background: var(--glass-bg-strong); border: 1px solid var(--glass-border); border-radius: var(--r-lg);
        padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 480px; margin: 0 auto;
    }
    .calc-inputs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .calc-field {
        background: rgba(255,255,255,0.08); padding: 12px 14px; border-radius: var(--r-md);
        border: 2px solid var(--glass-border-soft); cursor: pointer;
        display: flex; justify-content: space-between; align-items: center;
        transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .calc-field.active { border-color: var(--accent); background: rgba(255,255,255,0.2); box-shadow: 0 0 0 4px rgba(255,255,255,0.25); }
    .calc-field label { font-size: 12px; color: var(--text-muted); font-weight: 700; }
    .calc-field span { font-family: var(--font-num); font-size: 19px; font-weight: 700; color: var(--text-primary); }

    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .num-btn {
        background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border-soft); padding: 14px;
        font-family: var(--font-num); font-size: 18px; font-weight: 700; border-radius: var(--r-md);
        cursor: pointer; color: var(--text-primary); transition: background .12s;
    }
    .num-btn:active { background: rgba(255,255,255,0.25); }
    .btn-action { background: rgba(255,255,255,0.18); color: var(--accent-2); border-color: var(--glass-border); }
    .btn-save {
        grid-column: span 3; background: #ffffff; color: #1e3a8a;
        border: none; padding: 14px; font-family: var(--font-ui); font-size: 15.5px;
        font-weight: 800; border-radius: var(--r-md); margin-top: 5px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.2);
    }
    .btn-save:active{ transform: scale(0.98); }

    .search-overlay{
        position: absolute; inset: 0; z-index: 30;
        background: rgba(30, 58, 138, 0.95); backdrop-filter: blur(18px);
        display: none; flex-direction: column; padding: 16px;
    }
    .search-overlay.open{ display:flex; }
    .search-input-wrap{
        display:flex; align-items:center; gap:10px;
        background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
        border-radius: 999px; padding: 10px 16px; margin-bottom: 14px;
    }
    .search-input-wrap span{ font-size:16px; color: var(--text-muted); }
    #search-input{
        flex:1; background: transparent; border: none; outline: none;
        color: var(--text-primary); font-family: var(--font-ui); font-size: 14.5px; font-weight:600;
    }
    #search-input::placeholder{ color: var(--text-faint); }
    .search-close{ font-size: 13px; color: var(--accent-2); font-weight:700; cursor:pointer; background:none; border:none; }
    #search-results{ flex:1; overflow-y:auto; }
    .search-hit{
        background: var(--glass-bg-strong); border:1px solid var(--glass-border); border-radius: var(--r-md);
        padding: 13px 14px; margin-bottom: 10px; cursor:pointer;
    }
    .search-hit .name{ font-size:13.5px; font-weight:700; }
    .search-hit .path{ font-family: var(--font-num); font-size: 10px; color: var(--text-faint); margin-top:3px; }
    .search-empty{ color: var(--text-faint); text-align:center; margin-top: 40px; font-size: 13px; }

    .summary-fab-float{
        position: fixed; bottom: 95px;
        right: max(16px, calc(50vw - 300px));
        width: 56px; height: 56px; border-radius: 50%;
        background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        display: flex; align-items:center; justify-content:center;
        font-size: 22px; cursor:pointer; z-index: 40;
        box-shadow: 0 10px 28px rgba(0,0,0,0.4), 0 0 0 5px rgba(255,255,255,0.25);
        transform: scale(0); opacity: 0; pointer-events: none;
        transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
    }
    .summary-fab-float.visible{ transform: scale(1); opacity: 1; pointer-events: auto; }
    .summary-fab-float:active{ transform: scale(0.92); }
    .summary-fab-badge{
        position:absolute; top:-4px; right:-4px; min-width:19px; height:19px; padding: 0 4px;
        background: #ffffff; color:#1e3a8a;
        border-radius: 999px; font-family: var(--font-num); font-size: 10.5px; font-weight:700;
        display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .summary-sheet{
        position: fixed; inset: 0; z-index: 50;
        display: none; align-items: stretch; justify-content: center;
        background: var(--bg-deep);
    }
    .summary-sheet.open{ display:flex; }
    .summary-panel{
        width: 100%; max-width: 680px; height: 100dvh;
        background: rgba(29, 78, 216, 0.95); backdrop-filter: blur(26px) saturate(160%);
        border-left: 1px solid var(--glass-border-soft); border-right: 1px solid var(--glass-border-soft);
        border-radius: 0; padding: 0;
        display:flex; flex-direction:column;
        transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .summary-sheet.open .summary-panel{ transform: translateX(0); }
    .summary-panel-header{
        display:flex; align-items:center; justify-content:space-between;
        padding: 16px 18px; margin: 0;
        background: rgba(30, 64, 175, 0.6); backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--glass-border-soft);
        position: sticky; top:0; z-index: 5;
    }
    .summary-panel-header h3{ margin:0; font-size:16px; font-weight:800; }
    #summary-list{ overflow-y:auto; flex:1; padding: 16px; }
    .summary-group-title{ font-size: 11px; text-transform: uppercase; letter-spacing:.6px; color: var(--text-faint); font-weight:800; margin: 14px 0 8px; }
    .summary-row{
        background: var(--glass-bg-strong);
        border:1px solid var(--glass-border-soft); border-radius: var(--r-md); margin-bottom:9px;
        overflow: hidden; cursor: pointer;
    }
    .summary-row-main{ display:flex; align-items:center; gap:8px; padding: 12px 12px; }
    .summary-row .info{ flex:1; min-width:0; }
    .summary-row .info .name{ font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .summary-row .info .val{ font-family: var(--font-num); font-size:12px; color: var(--success); font-weight:700; margin-top:2px; }
    .expand-arrow{ font-size:12px; color: var(--text-faint); transition: transform .2s; flex-shrink:0; }
    .summary-row.expanded .expand-arrow{ transform: rotate(180deg); color: var(--accent-2); }
    .summary-row-details{
        max-height:0; opacity:0; overflow:hidden;
        transition: max-height .22s ease, opacity .18s ease, padding .22s ease;
        padding: 0 14px; font-family: var(--font-num); font-size: 12px; color: var(--text-muted);
        border-top: 1px solid var(--glass-border-soft);
    }
    .summary-row.expanded .summary-row-details{ max-height: 260px; opacity:1; padding: 10px 14px 12px; }
    .row-btn{
        width:34px; height:34px; border-radius:50%; border:1px solid var(--glass-border-soft);
        background: rgba(255,255,255,0.12); color: var(--text-primary); font-size:14px; cursor:pointer;
        display:flex; align-items:center; justify-content:center; flex-shrink:0;
        transition: background .15s, border-color .15s, color .15s;
    }
    .row-btn.edit{ color: var(--accent-2); }
    .row-btn.del{ color: var(--danger); }
    .row-btn.del.confirm{ background: var(--danger); color:#fff; border-color: var(--danger); font-size:12px; font-weight:800; }
    .summary-empty{ color: var(--text-faint); text-align:center; margin-top: 30px; font-size:13px; }
    .inline-edit{ display:flex; flex-direction:column; gap:8px; padding-top:2px; }
    .inline-edit-field{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .inline-edit-field label{ font-family: var(--font-ui); font-size:11.5px; color: var(--text-muted); font-weight:700; flex-shrink:0; }
    .inline-edit-field input{
        width: 90px; text-align:right; background: rgba(255,255,255,0.12); border:1px solid var(--glass-border);
        border-radius: 10px; padding: 7px 10px; color: var(--text-primary); font-family: var(--font-num);
        font-size: 14px; font-weight:700; outline:none;
    }
    .inline-edit-field input:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }
    .inline-save-btn{
        margin-top:4px; background: #ffffff; color:#1e3a8a;
        border:none; padding: 10px; border-radius: 10px; font-family: var(--font-ui); font-weight:800;
        font-size: 13px; cursor:pointer;
    }
    .inline-save-btn:active{ transform: scale(0.98); }
</style>
</head>
<body>

<div class="blob-3"></div>

<!-- PIN-қулф экрани -->
<div id="lock-screen">
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='500' height='500' fill='%231e3a8a'/><text x='50%' y='45%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='800' font-size='110'>max</text><text x='50%' y='68%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='800' font-size='110'>way</text></svg>" class="lock-logo" alt="Max Way">
    <div class="lock-title">Иловани очиш учун парол киритинг</div>
    <div class="pin-dots">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
    </div>
    <div class="pin-pad">
        <button class="pin-btn" onclick="pressPin('1')">1</button>
        <button class="pin-btn" onclick="pressPin('2')">2</button>
        <button class="pin-btn" onclick="pressPin('3')">3</button>
        <button class="pin-btn" onclick="pressPin('4')">4</button>
        <button class="pin-btn" onclick="pressPin('5')">5</button>
        <button class="pin-btn" onclick="pressPin('6')">6</button>
        <button class="pin-btn" onclick="pressPin('7')">7</button>
        <button class="pin-btn" onclick="pressPin('8')">8</button>
        <button class="pin-btn" onclick="pressPin('9')">9</button>
        <button class="pin-btn" style="visibility:hidden;"></button>
        <button class="pin-btn" onclick="pressPin('0')">0</button>
        <button class="pin-btn" onclick="clearPin()">⌫</button>
    </div>
    <div id="lock-error" class="lock-error"></div>
</div>

<div class="app-container">
    <div class="header">
        <button class="icon-btn" onclick="goBack()" aria-label="Орқага">&#8592;</button>
        <div class="header-logo-title" onclick="goHome()" title="Бош саҳифа">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='500' height='500' fill='%231e3a8a'/><text x='50%' y='45%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='800' font-size='110'>max</text><text x='50%' y='68%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='800' font-size='110'>way</text></svg>" class="header-logo" alt="Logo">
            <span class="title" id="header-title">Астатка</span>
        </div>
        <button class="icon-btn" onclick="toggleSearch()" aria-label="Қидириш">&#128269;</button>
    </div>

    <div id="home-menu" class="content">
        <button class="category-btn" onclick="openSection('склад')">Склад</button>
        <button class="category-btn" onclick="openSection('кухня')">Кухня</button>
    </div>

    <div id="categories-menu" class="content" style="display: none;">
        <h2 id="section-title" class="category-title">Бўлим</h2>
        <div id="categories-list"></div>
    </div>

    <div id="products-menu" class="content" style="display: none;">
        <h2 id="current-category-title" class="category-title"></h2>
        <div id="products-list"></div>
    </div>

    <div id="calc-page" class="content" style="display: none;">
        <h2 id="calc-product-title" class="category-title" style="font-size: 15px; margin-bottom: 12px;">Маҳсулот</h2>
        <div class="calc-wrapper">
            <div id="calc-inputs-container" class="calc-inputs"></div>
            <div class="numpad">
                <button class="num-btn" onclick="pressNum('1')">1</button>
                <button class="num-btn" onclick="pressNum('2')">2</button>
                <button class="num-btn" onclick="pressNum('3')">3</button>

<script>
    let savedValues = JSON.parse(localStorage.getItem('maxway_saved_values')) || {};
    let historyData = JSON.parse(localStorage.getItem('maxway_history_data')) || [];

    function persistData() {
        localStorage.setItem('maxway_saved_values', JSON.stringify(savedValues));
        localStorage.setItem('maxway_history_data', JSON.stringify(historyData));
    }

    let enteredPin = '';
    const correctPin = '5400';

    function lockApp() {
        enteredPin = '';
        updatePinDots();
        document.getElementById('lock-screen').style.display = 'flex';
    }

    function pressPin(digit) {
        if (enteredPin.length < 4) {
            enteredPin += digit;
            updatePinDots();
            if (enteredPin.length === 4) {
                if (enteredPin === correctPin) {
                    document.getElementById('lock-screen').style.display = 'none';
                } else {
                    document.getElementById('lock-error').innerText = 'Парол хато!';
                    setTimeout(() => {
                        enteredPin = '';
                        updatePinDots();
                        document.getElementById('lock-error').innerText = '';
                    }, 800);
                }
            }
        }
    }

    function clearPin() {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
        document.getElementById('lock-error').innerText = '';
    }

    function updatePinDots() {
        for (let i = 0; i < 4; i++) {
            const dot = document.getElementById('dot-' + i);
            if (i < enteredPin.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        }
    }

    function saveTodayToHistory() {
        if (Object.keys(savedValues).length === 0) {
            alert("Сақлаш учун маълумотлар киритилмаган!");
            return;
        }
        const todayStr = new Date().toLocaleDateString('uz-UZ', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        historyData.unshift({ date: todayStr, data: {...savedValues} });
        persistData();
        alert("Жорий остатка тарихга сақланди!");
        closeSummary();
    }

    function openHistorySheet() {
        const hList = document.getElementById('history-list');
        hList.innerHTML = '';
        if (historyData.length === 0) {
            hList.innerHTML = '<div class="summary-empty">Ҳали сақланган тарих мавжуд эмас</div>';
        } else {
            historyData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'summary-row';
                card.style.padding = '14px';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>📅 ${item.date}</strong>
                        <button class="row-btn del" onclick="deleteHistoryItem(${index})" title="Ўчириш">🗑</button>
                    </div>
                    <div style="font-size:12px; color:var(--text-muted); margin-top:8px;">Маҳсулотлар сони: ${Object.keys(item.data).length} та</div>
                `;
                hList.appendChild(card);
            });
        }
        document.getElementById('history-sheet').classList.add('open');
    }

    function closeHistorySheet() {
        document.getElementById('history-sheet').classList.remove('open');
    }

    function deleteHistoryItem(index) {
        if(confirm("Ушбу тарихни ўчиришни тасдиқлайсизми?")) {
            historyData.splice(index, 1);
            persistData();
            openHistorySheet();
        }
    }

    const petPackSizes = {
        'Bonaqua 0,5 л/ без газ': 12, 'Кола Zero 0,5 (Shakarsiz)': 12, 'Фанта 0,5 л': 12,
        'Fuse Tea 0,5 W.MELON': 12, 'Мультифрукт 1Л Сок Dena': 12, 'Яблоко мини 0,2л сок...': 24,
        'Fuse Tea 0,5 лимон': 12, 'Мультифрукт мини 0,2л...': 24, 'Яблочный 1Л Сок Dena': 12,
        'Fuse Tea 0,5 манго-ананас': 12, 'Сок Dena Ананасовый-Яблоко 1Л.': 12, 'Fuse Tea 0,5 манго-...': 12,
        'Сок Dena Апельсин 1Л.': 12, 'Fuse Tea 0,5 персик': 12, 'Сок Dena Вишня-яблоко 1Л.': 12,
        'Кола 0,5 л': 12, 'Сок Dena Персик 1Л.': 12, 'Кола 1,5 л': 6, 'Спрайт 0,5 л': 12

    const teaPackSizes = {

            }
        },
        'кухня': {

                'Масло': ['Масло растительное', 'Слив. масло Шедрое Лето/ Max Way', 'Фритюрная смесь Вегафрай-05/ ЕМКОСТЬ=7,5Л. "р"'],
                'Мясо': ['Донар Куринный Safi', 'Стрипсы "SAFI"-"ZO\'R"', 'Котлеты мясные Vivid 105гр.', 'Шницель 136гр/ "SAFI"-"ZO\'R"', 'Мясо для лаваша 70/30 (красная упак.)', 'Наггетсы темпурные флоупак 2кг/ Серволюкс'],
                'Молочные изделия': ['Молоко Lactel Pro 3,2%', 'Молоко Nestle 3,2%, 1L.', 'Сыр Cheddar/ Melkovita 1.033 кг (84 штук) хох', 'Сыр хохланд для Сендвича, 150гр.'], 
                'Бакалея': ['Чипсы'], 
                'Мука и мучные изделия': ['_Тостер хлеб/ Max Way', 'Булочки Гамбургер', 'Булочки Кинг Дог', 'Булочки Хот Дог мини', 'Герман хлеб (Булочки)', 'Лаваш Большой', 'Лаваш Большой Острый', 'Лаваш большой сырный', 'Лаваш Маленький', 'Лаваш маленький сырный', 'Саб донар булочка', 'Тортилья 10 дюйм (Оригинальные)', 'Хлеб донар молочный/бул/', 'Шаурма нон (Большой/бул)/ Max Way', 'Шаурма нон (Маленький /бул)/ Max Way'], 
                'Зелень': ['Айсберг чищеный/ Max Way', 'Кашнич/Кинза зелень'], 
                'Овощи': ['Капуста красная чищеная/ Max Way', 'Лук белый чищеный, упаковка= 500гр.', 'Огурцы корнишоны для Max Way', 'Огурцы свежие', 'Помидоры свежие для Max Way'], 
                'Колбасные изделия': ['Сосиски "Country Maple"'], 
                'Соуса': ['Кетчуп (Острый Соус) 950гр. MONARX', 'Кетчуп (Сладкий) - MaxWay', 'Лаваш Соус MONARX/ MW', 'Лимонный соус MF произ-во', 'Майонез клаб', 'Майонез Сметанный 5кг MONARX', 'Майонез Чимбой', 'Сашет "Кисло Сладкий" 25гр/ Max Way', 'Сашет "Соус Чили" 25гр/ Max Way', 'Сашет Кетчуп 25гр/ Max Way', 'Сашет Сырный 25гр/ Max Way', 'Сашет Чесночный 25гр', 'Соус Special 950гр MW', 'Соус Бургер Astoria 1кг', 'Соус Чесночный 950гр./ MW', 'Халапеньо шт (Сашет)'], 
                'Консервы': ['Кукуруза конс. 1 шт (280-340гр) Max Way'], 
                'Фрукты/ сухофрукты/ ягоды': ['Лимон свежий'], 
                'Крупы': ['Рис Лазер/ Max Way'], 
                'Картофель': ['Картофель по деревенски 2,5кг/Max Way', 'Картофель Фри с панировкой 6х6мм Фрай МИ/FMS6']
            }
        }
    };

    let currentSection = '';
    let currentCategory = '';
    let currentProduct = '';
    let activeField = '';
    let currentValues = {};

    const homeMenu = document.getElementById('home-menu');
    const categoriesMenu = document.getElementById('categories-menu');
    const productsMenu = document.getElementById('products-menu');
    const calcPage = document.getElementById('calc-page');
    const sectionTitle = document.getElementById('section-title');
    const categoriesList = document.getElementById('categories-list');
    const productsList = document.getElementById('products-list');
    const currentCategoryTitle = document.getElementById('current-category-title');
    const calcProductTitle = document.getElementById('calc-product-title');
    const inputsContainer = document.getElementById('calc-inputs-container');
    const headerTitle = document.getElementById('header-title');
    const searchOverlay = document.getElementById('search-overlay');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const summarySheet = document.getElementById('summary-sheet');
    const summaryList = document.getElementById('summary-list');
    const summaryFab = document.getElementById('summary-fab');
    const summaryFabBadge = document.getElementById('summary-fab-badge');

    function openSection(sectionKey) {
        currentSection = sectionKey;
        sectionTitle.innerText = appStructure[sectionKey].title;
        headerTitle.innerText = appStructure[sectionKey].title;
        categoriesList.innerHTML = '';
        for (let catName in appStructure[sectionKey].categories) {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.innerHTML = `<span>${catName}</span>`;
            btn.addEventListener('click', () => openCategory(catName));
            categoriesList.appendChild(btn);
        }
        homeMenu.style.display = 'none';
        calcPage.style.display = 'none';
        productsMenu.style.display = 'none';
        categoriesMenu.style.display = 'block';
    }

    function openCategory(categoryName) {
        currentCategory = categoryName;
        const products = appStructure[currentSection].categories[categoryName];
        if (!products || products.length === 0) {
            alert("Бу бўлим учун маҳсулотлар ҳали киритилмаган!");
            return;
        }
        categoriesMenu.style.display = 'none';
        productsMenu.style.display = 'block';
        currentCategoryTitle.innerText = categoryName;
        headerTitle.innerText = categoryName;
        renderProducts(products);
    }

    function computeProductDisplay(section, category, product) {
        const data = savedValues[product] || {};
        let main = '', details = '';

        if (section === 'склад') {
            if (category === 'Напитки') {
                if (product === 'Постмикс Coca Cola') {
                    const b10 = parseFloat(data.box10) || 0, b20 = parseFloat(data.box20) || 0, b30 = parseFloat(data.box30) || 0, l = parseFloat(data.liter) || 0;
                    main = `Жами: ${(b10 * 10) + (b20 * 20) + (b30 * 30) + l} л.`;
                    details = `(${b10}x10, ${b20}x20, ${b30}x30 | ${l}л)`;
                } else {
                    const d = parseFloat(data.dona) || 0, l = parseFloat(data.liter) || 0;
                    main = `Жами: ${d + l} л.`;
                    details = `(${d} дона | ${l} л.)`;
                }
            } else if (category === 'Напитки пэт') {
                const blok = parseFloat(data.blok) || 0, dona = parseFloat(data.dona) || 0, packSize = petPackSizes[product];
                main = `Жами: ${(blok * packSize) + dona} дона`;
                details = `${blok} блок, ${dona} дона`;
            } else if (category === 'Чай/ Кофе/Десерты') {
                if (teaPackSizes[product]) {
                    const pacha = parseFloat(data.pacha) || 0, dona = parseFloat(data.dona) || 0, packSize = teaPackSizes[product];
                    main = `Жами: ${(pacha * packSize) + dona} дона`;
                    details = `${pacha} қути, ${dona} дона`;
                } else {
                    main = `Жами: ${parseFloat(data.dona) || 0} дона`;
                    details = `Дона ҳисобида`;
                }
            }
        } else {
            if (category === 'Мука и мучные изделия') {
                const dona = parseFloat(data.dona) || 0, pacha = parseFloat(data.pacha) || 0;
                main = `${dona} дона, ${pacha} пач.`;
                details = `Дона ва пачка`;
            } else if (category === 'Овощи') {
                if (product === 'Помидоры свежие для Max Way') {
                    const kg = parseFloat(data.kg) || 0, gramm = parseFloat(data.gramm) || 0;
                    main = `${kg} кг, ${gramm} гр.`;
                    details = `Килограм ва грамм`;
                } else {
                    const gramm = parseFloat(data.gramm) || 0, dona = parseFloat(data.dona) || 0;
                    main = `${gramm} гр., ${dona} дона`;
                    details = `Грамм ва дона`;
                }
            } else if (category === 'Соуса') {
                const pacha = parseFloat(data.pacha) || 0, idish = parseFloat(data.idish) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${pacha} пач., ${idish} идиш, ${gramm} гр.`;
                details = `Пачка, идиш ва грамм`;
            } else if (category === 'Фрукты/ сухофрукты/ ягоды') {
                const pacha = parseFloat(data.pacha) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${pacha} пач., ${gramm} гр.`;
                details = `Пачка ва грамм`;
            } else if (category === 'Крупы') {
                const kg = parseFloat(data.kg) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${kg} кг, ${gramm} гр.`;
                details = `1 кг ва грамм`;
            } else if (dessertBoxSizes[product]) {
                const karobka = parseFloat(data.karobka) || 0, dona = parseFloat(data.dona) || 0;
                main = `Жами: ${(karobka * dessertBoxSizes[product]) + dona} дона`;
                details = `${karobka} кар., ${dona} дона`;
            } else if (product === 'Смесь пломбир ж') {
                const karobka = parseFloat(data.karobka) || 0, liter = parseFloat(data.liter) || 0;
                main = `Жами: ${(karobka * 10) + liter} л.`;
                details = `${karobka} кар., ${liter} л.`;
            } else if (product === 'Мясо для лаваша 70/30 (красная упак.)') {
                const r10 = parseFloat(data.r10) || 0, r20 = parseFloat(data.r20) || 0, r30 = parseFloat(data.r30) || 0, extraKg = parseFloat(data.extraKg) || 0;
                const totalKg = (r10 * 10) + (r20 * 20) + (r30 * 30) + extraKg;
                main = `Жами: ${totalKg} кг`;
                details = `(10к:${r10}, 20к:${r20}, 30к:${r30} | ортиқ: ${extraKg}кг)`;
            } else if (product === 'Шницель 136гр/ "SAFI"-"ZO\'R"') {
                const karobka = parseFloat(data.karobka) || 0, dona = parseFloat(data.dona) || 0;
                main = `Жами: ${(karobka * 20) + dona} дона`;
                details = `${karobka} кар., ${dona} дона`;
            } else if (product === 'Стрипсы "SAFI"-"ZO\'R"') {
                const karobka = parseFloat(data.karobka) || 0, pacha = parseFloat(data.pacha) || 0;
                main = `Жами: ${(karobka * 5) + pacha} пачка`;
                details = `${karobka} кар., ${pacha} пач.`;
            } else if (product === 'Чипсы') {
                const karobka = parseFloat(data.karobka) || 0, pacha = parseFloat(data.pacha) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${karobka} кар., ${pacha} пач., ${gramm} гр.`;
                details = `Каробка, пачка ва грамм`;
            } else if (product === 'Айсберг чищеный/ Max Way') {
                const dona = parseFloat(data.dona) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${dona} дона, ${gramm} гр.`;
                details = `Дона ва грамм`;
            } else if (product === 'Кашнич/Кинза зелень') {
                const bog = parseFloat(data.bog) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${bog} боғ, ${gramm} гр.`;
                details = `Боғ ва грамм`;
            } else if (product === 'Сосиски "Country Maple"') {
                const karobka = parseFloat(data.karobka) || 0, pacha = parseFloat(data.pacha) || 0, dona = parseFloat(data.dona) || 0;
                main = `${karobka} кар., ${pacha} пач., ${dona} дона`;
                details = `Каробка, пачка ва дона`;
            } else if (product === 'Кукуруза конс. 1 шт (280-340гр) Max Way') {
                const dona = parseFloat(data.dona) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${dona} дона, ${gramm} гр.`;
                details = `Дона ва грамм`;
            } else {
                const karobka = parseFloat(data.karobka) || 0, gramm = parseFloat(data.gramm) || 0;
                main = `${karobka} кар., ${gramm} гр.`;
                details = `Каробка ва грамм`;
            }
        }
        return { main, details };
    }

    function renderProducts(products) {
        productsList.innerHTML = '';
        products.forEach(product => {
            const { main, details } = computeProductDisplay(currentSection, currentCategory, product);

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <span class="product-title"></span>
                <div class="product-val">
                    <span class="total-text"></span>
                    <span class="details-text"></span>
                </div>
            `;
            card.querySelector('.product-title').textContent = product;
            card.querySelector('.total-text').textContent = main;
            card.querySelector('.details-text').textContent = details;
            card.addEventListener('click', () => openCalc(product));
            productsList.appendChild(card);
        });
    }

    function getFieldDefs(section, category, product) {
        if (section === 'склад' && category === 'Напитки') {
            if (product === 'Постмикс Coca Cola') {
                return [
                    { key: 'box10', label: '10л Каробка' },
                    { key: 'box20', label: '20л Каробка' },
                    { key: 'box30', label: '30л Каробка' },
                    { key: 'liter', label: 'Литр' }
                ];
            }
            return [ { key: 'dona', label: 'Дона' }, { key: 'liter', label: 'Литр' } ];
        } else if (section === 'склад' && category === 'Напитки пэт') {
            return [ { key: 'blok', label: 'Блок' }, { key: 'dona', label: 'Дона' } ];
        } else if (section === 'склад' && category === 'Чай/ Кофе/Десерты' && teaPackSizes[product]) {
            return [ { key: 'pacha', label: 'Қути' }, { key: 'dona', label: 'Дона' } ];
        } else if (section === 'кухня') {
            if (category === 'Мука и мучные изделия') {
                return [ { key: 'dona', label: 'Дона' }, { key: 'pacha', label: 'Пачка' } ];
            } else if (category === 'Овощи') {
                if (product === 'Помидоры свежие для Max Way') {
                    return [ { key: 'kg', label: 'Килограм (кг)' }, { key: 'gramm', label: 'Грамм (гр)' } ];
                }
                return [ { key: 'gramm', label: 'Грамм (гр)' }, { key: 'dona', label: 'Дона' } ];
            } else if (category === 'Соуса') {
                return [ { key: 'pacha', label: 'Пачка' }, { key: 'idish', label: 'Идиш' }, { key: 'gramm', label: 'Грамм' } ];
            } else if (category === 'Фрукты/ сухофрукты/ ягоды') {
                return [ { key: 'pacha', label: 'Пачка' }, { key: 'gramm', label: 'Грамм' } ];
            } else if (category === 'Крупы') {
                return [ { key: 'kg', label: 'Килограм (1 кг)' }, { key: 'gramm', label: 'Грамм' } ];
            } else if (dessertBoxSizes[product]) {
                return [ { key: 'karobka', label: 'Каробка' }, { key: 'dona', label: 'Дона' } ];
            } else if (product === 'Смесь пломбир ж') {
                return [ { key: 'karobka', label: 'Каробка' }, { key: 'liter', label: 'Литр' } ];
            } else if (product === 'Мясо для лаваша 70/30 (красная упак.)') {
                return [
                    { key: 'r10', label: '10 кг урам' },
                    { key: 'r20', label: '20 кг урам' },
                    { key: 'r30', label: '30 кг урам' },
                    { key: 'extraKg', label: 'Ортиқча кг' }
                ];
            } else if (product === 'Шницель 136гр/ "SAFI"-"ZO\'R"') {
                return [ { key: 'karobka', label: 'Каробка' }, { key: 'dona', label: 'Дона' } ];
            } else if (product === 'Стрипсы "SAFI"-"ZO\'R"') {
                return [ { key: 'karobka', label: 'Каробка' }, { key: 'pacha', label: 'Пачка' } ];
            } else if (product === 'Чипсы') {
                return [ { key: 'karobka', label: 'Каробка' }, { key: 'pacha', label: 'Пачка' }, { key: 'gramm', label: 'Грамм' } ];
            } else if (product === 'Айсберг чищеный/ Max Way') {
                return [ { key: 'dona', label: 'Дона' }, { key: 'gramm', label: 'Грамм' } ];
            } else if (product === 'Кашнич/Кинза зелень') {
                return [ { key: 'bog', label: 'Боғ' }, { key: 'gramm', label: 'Грамм' } ];
            } else if (product === 'Сосиски "Country Maple"') {
                return [ { key: 'karobka', label: 'Каробка' }, { key: 'pacha', label: 'Пачка' }, { key: 'dona', label: 'Дона' } ];
            } else if (product === 'Кукуруза конс. 1 шт (280-340гр) Max Way') {
                return [ { key: 'dona', label: 'Дона' }, { key: 'gramm', label: 'Грамм' } ];
            }
        }
        return [ { key: 'karobka', label: 'Каробка' }, { key: 'gramm', label: 'Грамм' } ];
    }

    function openCalc(productName) {
        currentProduct = productName;
        calcProductTitle.innerText = productName;
        headerTitle.innerText = productName;
        const data = savedValues[productName] || {};
        const fields = getFieldDefs(currentSection, currentCategory, productName);

        currentValues = {};
        fields.forEach(f => { currentValues[f.key] = data[f.key] || '0'; });

        inputsContainer.innerHTML = fields.map(f => `
            <div id="field-${f.key}" class="calc-field" onclick="setActiveField('${f.key}')"><label>${f.label}</label><span id="display-${f.key}">${currentValues[f.key]}</span></div>
        `).join('');
        setActiveField(fields[0].key);

        homeMenu.style.display = 'none';
        categoriesMenu.style.display = 'none';
        productsMenu.style.display = 'none';
        calcPage.style.display = 'block';
    }

    function setActiveField(field) {
        activeField = field;
        const fields = inputsContainer.getElementsByClassName('calc-field');
        for(let i = 0; i < fields.length; i++) fields[i].classList.remove('active');
        const el = document.getElementById('field-' + field);
        if(el) el.classList.add('active');
    }

    function pressNum(num) {
        if (!activeField) return;
        let val = currentValues[activeField];
        if (val === '0' && num !== '.') val = num;
        else val += num;
        currentValues[activeField] = val;
        const disp = document.getElementById('display-' + activeField);
        if(disp) disp.innerText = val;
    }

    function pressClear() {
        if (!activeField) return;
        let val = currentValues[activeField];
        val = val.slice(0, -1) || '0';
        currentValues[activeField] = val;
        const disp = document.getElementById('display-' + activeField);
        if(disp) disp.innerText = val;
    }

    function saveValue() {
        savedValues[currentProduct] = {...currentValues};
        persistData();
        calcPage.style.display = 'none';
        productsMenu.style.display = 'block';
        headerTitle.innerText = currentCategory;
        openCategory(currentCategory);
        updateSummaryFab();
    }

    function goBack() {
        if (summarySheet.classList.contains('open')) { closeSummary(); return; }
        if (document.getElementById('history-sheet').classList.contains('open')) { closeHistorySheet(); return; }
        if (searchOverlay.classList.contains('open')) { closeSearch(); return; }
        if (calcPage.style.display === 'block') {
            calcPage.style.display = 'none';
            productsMenu.style.display = 'block';
            headerTitle.innerText = currentCategory;
        } else if (productsMenu.style.display === 'block') {
            productsMenu.style.display = 'none';
            categoriesMenu.style.display = 'block';
            headerTitle.innerText = appStructure[currentSection].title;
        } else if (categoriesMenu.style.display === 'block') {
            categoriesMenu.style.display = 'none';
            homeMenu.style.display = 'block';
            headerTitle.innerText = 'Астатка';
        }
    }

    function goHome() {
        closeSearch();
        closeSummary();
        closeHistorySheet();
        calcPage.style.display = 'none';
        productsMenu.style.display = 'none';
        categoriesMenu.style.display = 'none';
        homeMenu.style.display = 'block';
        headerTitle.innerText = 'Астатка';
    }

    function flattenAllProducts() {
        const list = [];
        for (const sectionKey in appStructure) {
            const cats = appStructure[sectionKey].categories;
            for (const catName in cats) {
                cats[catName].forEach(product => list.push({ section: sectionKey, category: catName, product }));
            }
        }
        return list;
    }

    function toggleSearch() {
        if (searchOverlay.classList.contains('open')) { closeSearch(); return; }
        searchOverlay.classList.add('open');
        searchInput.value = '';
        searchResults.innerHTML = '';
        setTimeout(() => searchInput.focus(), 50);
    }

    function closeSearch() {
        searchOverlay.classList.remove('open');
    }

    function onSearchInput(value) {
        const q = value.trim().toLowerCase();
        searchResults.innerHTML = '';
        if (!q) return;
        const hits = flattenAllProducts().filter(item => item.product.toLowerCase().includes(q)).slice(0, 40);
        if (hits.length === 0) {
            searchResults.innerHTML = '<div class="search-empty">Ҳеч нарса топилмади</div>';
            return;
        }
        hits.forEach(hit => {
            const el = document.createElement('div');
            el.className = 'search-hit';
            el.innerHTML = `<div class="name"></div><div class="path"></div>`;
            el.querySelector('.name').textContent = hit.product;
            el.querySelector('.path').textContent = `${appStructure[hit.section].title} / ${hit.category}`;
            el.addEventListener('click', () => {
                closeSearch();
                jumpToProduct(hit.section, hit.category, hit.product);
            });
            searchResults.appendChild(el);
        });
    }

    function jumpToProduct(section, category, product) {
        currentSection = section;
        currentCategory = category;
        renderProducts(appStructure[section].categories[category]);
        currentCategoryTitle.innerText = category;
        openCalc(product);
    }

    function hasNonZero(data) {
        return Object.values(data).some(v => parseFloat(v) > 0);
    }

    function updateSummaryFab() {
        const count = flattenAllProducts().filter(item => savedValues[item.product] && hasNonZero(savedValues[item.product])).length;
        if (count > 0) {
            summaryFab.classList.add('visible');
            summaryFabBadge.style.display = 'flex';
            summaryFabBadge.textContent = count > 99 ? '99+' : String(count);
        } else {
            summaryFab.classList.remove('visible');
            summaryFabBadge.style.display = 'none';
        }
    }

    updateSummaryFab();

    function openSummary() {
        buildSummary();
        summarySheet.classList.add('open');
    }

    function closeSummary() {
        summarySheet.classList.remove('open');
    }

    function buildSummary() {
        summaryList.innerHTML = '';
        const entries = flattenAllProducts().filter(item => savedValues[item.product] && hasNonZero(savedValues[item.product]));

        if (entries.length === 0) {
            summaryList.innerHTML = '<div class="summary-empty">Ҳали ҳеч қандай маълумот киритилмаган</div>';
            return;
        }

        let lastGroup = '';
        entries.forEach(item => {
            const groupKey = `${appStructure[item.section].title} — ${item.category}`;
            if (groupKey !== lastGroup) {
                const h = document.createElement('div');
                h.className = 'summary-group-title';
                h.textContent = groupKey;
                summaryList.appendChild(h);
                lastGroup = groupKey;
            }
            const { main, details } = computeProductDisplay(item.section, item.category, item.product);

            const row = document.createElement('div');
            row.className = 'summary-row';
            row.innerHTML = `
                <div class="summary-row-main">
                    <div class="info"><div class="name"></div><div class="val"></div></div>
                    <button class="row-btn edit" title="Таҳрирлаш">✎</button>
                    <button class="row-btn del" title="Ўчириш">🗑</button>
                    <span class="expand-arrow">⌄</span>
                </div>
                <div class="summary-row-details"></div>
            `;
            const mainEl = row.querySelector('.summary-row-main');
            const detailsEl = row.querySelector('.summary-row-details');
            const editBtn = row.querySelector('.edit');
            const delBtn = row.querySelector('.del');

            row.querySelector('.name').textContent = item.product;
            row.querySelector('.val').textContent = main;
            detailsEl.textContent = details;

            mainEl.addEventListener('click', (e) => {
                if (e.target.closest('.row-btn')) return;
                const nowExpanded = row.classList.toggle('expanded');
                if (nowExpanded) {
                    const { details: d } = computeProductDisplay(item.section, item.category, item.product);
                    detailsEl.textContent = d;
                }
            });

            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                row.classList.add('expanded');
                openInlineEdit(detailsEl, row, item);
            });

            let delTimer = null;
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!delBtn.classList.contains('confirm')) {
                    delBtn.classList.add('confirm');
                    delBtn.textContent = '✓';
                    delBtn.title = 'Тасдиқлаш учун яна босинг';
                    delTimer = setTimeout(() => {
                        delBtn.classList.remove('confirm');
                        delBtn.textContent = '🗑';
                        delBtn.title = 'Ўчириш';
                    }, 2500);
                } else {
                    clearTimeout(delTimer);
                    delete savedValues[item.product];
                    persistData();
                    buildSummary();
                    updateSummaryFab();
                }
            });

            summaryList.appendChild(row);
        });
    }

    function openInlineEdit(detailsEl, row, item) {
        const data = savedValues[item.product] || {};
        const fields = getFieldDefs(item.section, item.category, item.product);

        detailsEl.innerHTML = `
            <div class="inline-edit">
                ${fields.map(f => `
                    <div class="inline-edit-field">
                        <label>${f.label}</label>
                        <input type="text" inputmode="decimal" data-key="${f.key}" value="${data[f.key] || '0'}">
                    </div>
                `).join('')}
                <button class="inline-save-btn">Сақлаш</button>
            </div>
        `;

        detailsEl.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('click', (e) => e.stopPropagation());
        });

        detailsEl.querySelector('.inline-save-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const newData = {};
            detailsEl.querySelectorAll('input[data-key]').forEach(inp => {
                const v = inp.value.trim().replace(',', '.');
                newData[inp.dataset.key] = v === '' || isNaN(parseFloat(v)) ? '0' : v;
            });
            savedValues[item.product] = newData;
            persistData();

            const { main, details } = computeProductDisplay(item.section, item.category, item.product);
            row.querySelector('.val').textContent = main;
            detailsEl.textContent = details;
            updateSummaryFab();
        });
    }
</script>

</body>
</html>
